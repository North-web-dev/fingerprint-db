name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install jsonschema
      # Validates fingerprints.json against schema.json + completeness/format
      # checks. Runs on every push AND pull_request, so any new or edited entry
      # is checked automatically before merge.
      - run: python validate.py
      - run: python -c "import fingerprint_db; assert fingerprint_db.get('chrome')['tls']['ja4']; print('python loader OK')"
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: go build ./... && go test ./...
