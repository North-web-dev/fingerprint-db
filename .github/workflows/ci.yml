name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install jsonschema
      - run: python -c "import json,jsonschema; jsonschema.validate(json.load(open('fingerprints.json')), json.load(open('schema.json'))); print('schema OK')"
      - run: python -c "import fingerprint_db; assert fingerprint_db.get('chrome')['tls']['ja4']; print('python loader OK')"
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: go build ./... && go test ./...
